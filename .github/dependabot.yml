version: 2
updates:
  # Grouped and monthly on purpose: this is a small team, and a wall of open PRs
  # gets ignored, which is worse than a slightly older lockfile. Security
  # advisories still arrive immediately, separately from this schedule.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    # Majors on these are breaking, not routine. The AI SDK dropped `maxSteps`
    # (which the agent route relies on) between v4 and v5, and React, Next and
    # Express majors all need a deliberate migration rather than a merge button.
    ignore:
      - dependency-name: "ai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@ai-sdk/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "express"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
